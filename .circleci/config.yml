version: 2.1

jobs:
  build:
    parameters:
      node-tag:
        type: string
    docker:
      - image: cimg/node:<< parameters.node-tag >>
    steps:
      - checkout
      - run:
          name: Install exact dependencies
          command: lmx_skip_postinstall=yes npm ci --no-audit --no-fund
      - run:
          name: Verify generated config and TypeScript
          command: npm run compile:check
      - run:
          name: Build CommonJS and ESM
          command: npm run build
      - run:
          name: Run tests
          command: npm test

workflows:
  build_nodejs:
    jobs:
      - build:
          name: node-22-minimum
          node-tag: "22.9"
      - build:
          name: node-24-lts
          node-tag: "24.18"
